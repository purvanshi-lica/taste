[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taste-scorer"
version = "0.1.0"
description = "Inference for the TASTE preference model: per-dimension scoring of image pairs against a text prompt."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Lica"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.46",
    "accelerate>=0.30",
    "qwen-vl-utils>=0.0.10",
    "peft>=0.10",
    "Pillow>=10.0",
    "pandas>=2.0",
    "tqdm>=4.65",
    "numpy>=1.24",
]

[project.scripts]
taste-score = "taste_scorer.cli:main"

[project.urls]
Homepage = "https://github.com/purvanshi-lica/taste"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taste_scorer = ["py.typed"]
